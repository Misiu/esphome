one_wire:
  - platform: esp32_rmt_one_wire
    id: rmt_one_wire_bus
    pin: ${one_wire_pin}

sensor:
  - platform: dallas_temp
    one_wire_id: rmt_one_wire_bus
    address: 0x1C0000031EDD2A28
    name: Dallas Temperature RMT 1
    resolution: 9
  - platform: dallas_temp
    one_wire_id: rmt_one_wire_bus
    name: Dallas Temperature RMT 2
  - platform: dallas_temp
    one_wire_id: rmt_one_wire_bus
    name: Dallas Temperature RMT 3
    index: 2
